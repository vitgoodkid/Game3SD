name: Kiểm tra

# Vì sao có file này: chủ dự án làm việc từ điện thoại, máy có Godot thì tắt.
# Không có CI thì mọi thay đổi ở tầng luật đều là đoán mò. Mỗi lần đẩy code
# lên là job này chạy đúng bộ kiểm tra mà máy bàn chạy, và trả lời được câu
# "có gãy gì không" mà không cần mở Godot.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Đổi phiên bản Godot ở ĐÚNG MỘT chỗ này.
  PHIEN_BAN: 4.7.2

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Tải Godot headless
        run: |
          set -e
          TEN="Godot_v${PHIEN_BAN}-stable_linux.x86_64"
          # Bản mới nằm ở godot-builds, bản cũ ở repo chính. Thử cả hai.
          for GOC in \
            "https://github.com/godotengine/godot-builds/releases/download/${PHIEN_BAN}-stable" \
            "https://github.com/godotengine/godot/releases/download/${PHIEN_BAN}-stable"
          do
            if curl -fsSL -o godot.zip "${GOC}/${TEN}.zip"; then
              echo "Tải được từ ${GOC}"
              break
            fi
          done
          test -s godot.zip || { echo "KHONG TAI DUOC GODOT ${PHIEN_BAN}"; exit 1; }
          unzip -q godot.zip
          mv "${TEN}" godot
          chmod +x godot
          ./godot --version

      - name: Nhập tài nguyên
        # Lần chạy đầu Godot phải dựng .godot/ — tách riêng để lỗi nhập tài
        # nguyên không lẫn vào lỗi của bộ kiểm tra.
        #
        # `set -o pipefail` KHÔNG được bỏ. Không có nó thì mã thoát của bước
        # này là mã của `tee`, tức là luôn 0 — và một lần Godot ĐỔ GIỮA CHỪNG
        # (signal 4, "Index p_index = -1 is out of bounds", lỗi nằm trong
        # trình nhập của engine chứ không trong repo) đã trôi qua đúng chỗ
        # này: CI chạy tiếp với một dự án mới nhập được vài file, rồi ba phép
        # thử phần NHÌN đỏ lên vì thiếu font và thiếu clip. Đọc ra thì giống
        # hệt vừa làm hỏng gameplay, trong khi không file nào trong repo sai.
        #
        # Chạy lại một lần nếu đổ: cú đổ đó không tái hiện được (nhập nguội ba
        # lần liên tiếp trên máy khác đều sạch), và lần sau nhặt tiếp chỗ còn
        # dở từ phần cache đã dựng xong. Đổ cả hai lần thì mới là chuyện thật
        # và bước này đỏ.
        run: |
          set -o pipefail
          nhap() { timeout 600 ./godot --headless --path . --import 2>&1 | tee -a nhap.log; }
          nhap || {
            echo "::warning::Đợt nhập đầu đổ giữa chừng — chạy lại lần hai"
            nhap
          }

      - name: Không được có lỗi biên dịch script
        run: |
          # Script hỏng thì Godot vẫn thoát mã 0 ở bước --import, nên phải tự
          # dò trong log. Đây từng là chỗ lỗi trôi qua CI mà không ai thấy.
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" nhap.log; then
            echo "::error::Có script không biên dịch được"
            grep -E "SCRIPT ERROR|Parse Error|Failed to load script" -A2 nhap.log
            exit 1
          fi

      - name: Nhập đủ, không sót tài nguyên nào
        # Mã thoát 0 CHƯA đủ để nói đợt nhập đã chạy trọn — xem ghi chú ở
        # bước trên. Đây là phép kiểm dương: mọi file `.import` phải có đủ
        # file đích trong `.godot/imported/`. Thiếu một cái là dừng ngay tại
        # đây, thay vì để bộ kiểm tra đỏ ở một chỗ chẳng liên quan gì.
        run: python3 tools/kiem_nhap.py

      - name: Chạy bộ kiểm tra
        # Bộ kiểm tra tự thoát mã 1 nếu có cái hỏng (xem tools/kiem_tra.gd).
        # timeout để phòng trường hợp scene không nạp được — khi đó Godot
        # headless treo vô hạn chứ không báo lỗi.
        run: timeout 300 ./godot --headless --path . tools/kiem_tra.tscn

      - name: Chạy thử vòng lặp souls
        # Bộ kiểm tra ở trên chạy trong một khung hình và không nạp scene nào,
        # nên nó không với tới được mốc 4: chết → rơi vũng hồn → đứng dậy ở bia
        # → quái sống lại. Chuỗi ấy diễn ra theo thời gian qua nhiều node, và
        # hỏng thì hỏng cả mốc. Bộ này nạp phòng thử thật rồi diễn lại nó.
        run: timeout 300 ./godot --headless --path . tools/thu_vong_lap.tscn

      - name: Chạy thử thế giới
        # Mốc 6 sinh cả một vùng từ CSV rồi nạp/huỷ ô theo chân người chơi.
        # Cái hỏng ở đây là loại hỏng hai bộ trên không với tới: đất thủng,
        # cây mọc trên vách, ô nạp rồi không huỷ, đi lại một chỗ hai lần thấy
        # hai cảnh khác nhau.
        run: timeout 300 ./godot --headless --path . tools/thu_the_gioi.tscn

      - name: Chạy thử màn đầu game
        # Chơi mới / Chơi tiếp / Tải ván đều là ĐỔI CẢNH, mà trạng thái thì
        # nằm trong autoload nên nó sống qua cú đổi ấy. Ba bộ trên đều bị buộc
        # vào một cảnh nên không bộ nào với tới được.
        run: timeout 300 ./godot --headless --path . tools/thu_dau_game.tscn

      - name: Chạy thử game 600 khung hình
        # Bước này nạp một cảnh CHƠI THẬT, cho nhân vật và quái chạy 10 giây,
        # bắt lỗi lúc chạy mà test tĩnh không thấy: node null, tín hiệu nối
        # hụt, chia cho 0, vòng tròn autoload.
        #
        # Trỏ vào VÙNG THẬT chứ không dựa vào `main_scene`: từ khi có màn hình
        # đầu game thì `main_scene` là cái menu, mà chạy 600 khung hình một cái
        # menu đứng yên thì không bắt được gì.
        #
        # Trước đây bước này trỏ vào `phong_thu.tscn`, lý do ghi rõ là "phải
        # nạp chỗ CÓ QUÁI đi lại". Từ khi phòng thử mặc định TRỐNG quái
        # (`PhongThu.co_quai = false` — nó là chỗ soi động tác) thì lý do ấy
        # không còn đúng với nó nữa, mà lại đúng với `vung_dat.tscn`: vùng
        # thật có quái, có boss, VÀ có streaming ô địa hình — tức là nó còn
        # phủ được cả đường code mà phòng thử chưa bao giờ chạm tới.
        run: |
          timeout 300 ./godot --headless --path . scenes/the_gioi/vung_dat.tscn \
            --quit-after 600 2>&1 | tee chay.log
          if grep -qE "SCRIPT ERROR|Parse Error" chay.log; then
            echo "::error::Có lỗi lúc chạy"
            grep -E "SCRIPT ERROR|Parse Error" -A6 chay.log
            exit 1
          fi

      - name: Dữ liệu sinh lại phải khớp
        # tools/sinh_du_lieu.py cần bản 2D nên không chạy được trên CI. Thay
        # vào đó kiểm những bất biến mà tay người dễ phá nhất khi sửa CSV.
        run: python3 tools/kiem_csv.py
